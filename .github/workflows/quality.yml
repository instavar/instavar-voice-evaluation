name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - run: python -m compileall -q instavar_voice_lab tests
      - run: python -m unittest discover -s tests -v
      - run: instavar-voice-eval validate capability examples/capability-manifest.json
      - run: instavar-voice-eval validate experiment examples/experiment-manifest.json
      - run: instavar-voice-eval validate evaluation examples/evaluation-report.json
      - run: instavar-voice-eval validate package examples/artifact-package.json
      - run: instavar-voice-eval validate-observations examples/objective-observations.json --require-version --require-seed --require-runtime
      - run: instavar-voice-eval compare-matched examples/matched-objective-observations.json --plan examples/matched-generation-plan.json --baseline base-model --adapted selected-adapter --output /tmp/matched-comparison.json
